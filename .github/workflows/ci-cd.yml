name: CI/CD Examen Final

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + unitarias + integracion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify surefire-report:report

      - name: Publicar reportes JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-junit
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/surefire-report.html

      - name: Publicar aplicacion empaquetada
        uses: actions/upload-artifact@v7
        with:
          name: reserva-lab-jar
          path: target/reserva-lab.jar

  acceptance-tests:
    name: Acceptance tests Selenium
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar aplicacion
        run: mvn -B -DskipTests package

      - name: Levantar ambiente de aceptacion
        shell: pwsh
        run: ./scripts/blue-green-deploy.ps1 deploy -Version "acceptance-${{ github.run_number }}" -RuntimeDirectory .runtime-acceptance

      - name: Ejecutar flujo de usuario con Selenium
        shell: pwsh
        run: |
          $baseUrl = Get-Content .runtime-acceptance/current-url.txt -Raw
          mvn -B -Pacceptance verify "-Dacceptance.baseUrl=$($baseUrl.Trim())"

      - name: Publicar evidencia de aceptacion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-selenium
          path: |
            target/acceptance-evidence/
            target/failsafe-reports/
            .runtime-acceptance/deployment-history.log

      - name: Cerrar ambiente de aceptacion
        if: always()
        shell: pwsh
        run: ./scripts/blue-green-deploy.ps1 cleanup -RuntimeDirectory .runtime-acceptance

  deploy-test:
    name: Deploy Blue-Green + rollback
    runs-on: ubuntu-latest
    needs: acceptance-tests
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar aplicacion
        run: mvn -B -DskipTests package

      - name: Desplegar version inicial en Blue
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/deployment-evidence -Force | Out-Null
          ./scripts/blue-green-deploy.ps1 deploy -Version "1.0.${{ github.run_number }}" | Tee-Object target/deployment-evidence/01-deploy-blue.log
          $url = (Get-Content .runtime/current-url.txt -Raw).Trim()
          Invoke-RestMethod "$url/api/health" | ConvertTo-Json | Set-Content target/deployment-evidence/02-health-blue.json

      - name: Desplegar nueva version en Green
        shell: pwsh
        run: |
          ./scripts/blue-green-deploy.ps1 deploy -Version "1.1.${{ github.run_number }}" | Tee-Object target/deployment-evidence/03-deploy-green.log
          $url = (Get-Content .runtime/current-url.txt -Raw).Trim()
          Invoke-RestMethod "$url/api/health" | ConvertTo-Json | Set-Content target/deployment-evidence/04-health-green.json
          ./scripts/blue-green-deploy.ps1 status | Tee-Object target/deployment-evidence/05-status-before-rollback.log

      - name: Ejecutar rollback y verificar Blue
        shell: pwsh
        run: |
          ./scripts/blue-green-deploy.ps1 rollback | Tee-Object target/deployment-evidence/06-rollback.log
          $url = (Get-Content .runtime/current-url.txt -Raw).Trim()
          Invoke-RestMethod "$url/api/health" | ConvertTo-Json | Set-Content target/deployment-evidence/07-health-after-rollback.json
          ./scripts/blue-green-deploy.ps1 status | Tee-Object target/deployment-evidence/08-status-after-rollback.log
          Copy-Item .runtime/deployment-history.log target/deployment-evidence/09-deployment-history.log

      - name: Publicar evidencia de despliegue y rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-blue-green-rollback
          path: target/deployment-evidence/

      - name: Cerrar slots de prueba
        if: always()
        shell: pwsh
        run: ./scripts/blue-green-deploy.ps1 cleanup

